name: photo-tools
label: "Photo tools"
links:
  studio: {url: "/studio/", label: "Studio"}
content:
  root: ~/.openclaw/workspace/shared/photo-tools
  areas:
    finals:
      link_template: {url: "/studio/new?src={path}", label: "Tweak"}
      dir: ~/.openclaw/workspace/shared/finals
      media: [photo, video]
    favorites:
      link_template: {url: "/studio/new?src={path}", label: "Tweak"}
      dir: ~/.openclaw/workspace/shared/favorites
      media: [photo]
    anime:
      link_template: {url: "/studio/new?src={path}", label: "Tweak"}
      dir: ~/.openclaw/workspace/shared/anime
      media: [photo]
    edit-later:
      link_template: {url: "/studio/new?src={path}", label: "Tweak"}
      dir: ~/.openclaw/workspace/shared/edit-later
      media: [photo]
    candidates:
      link_template: {url: "/studio/new?src={path}", label: "Tweak"}
      dir: ~/.openclaw/workspace/shared/candidates
      media: [photo]
    surreal:
      dir: ~/.openclaw/workspace/shared/surreal-with-face
      media: [photo]
      hidden_by_default: true
    intermediates:
      dir: ~/.openclaw/workspace/shared/tool-outputs-intermediates
      media: [photo, video]
      hidden_by_default: true
actions_from_registry: ~/gitrep/manipulating-photos/manipulating-photos-with-ui/tool_registry.json
script_base: ~/gitrep/manipulating-photos
registry_output_area: intermediates   # finals are pinned to shared/finals by the tools themselves
actions:
  studio-apply-recipe:
    label: "Studio: apply recipe to selected photos"
    script: ~/gitrep/manipulating-photos/studio/apply_recipe.py
    source_arg: "--source"
    output_dir_arg: "--local-output-dir"
    output_area: intermediates
    params:
      recipe: {type: str, flag: "--recipe", description: "recipe slug (see /studio/recipes)"}
    wall_time_estimate_sec: 300
  studio-mine-taste:
    quiet: true
    label: "Studio: regenerate taste profile from favorites + journal"
    script: ~/gitrep/manipulating-photos/studio/mine_taste.py
    wall_time_estimate_sec: 120
  refresh-candidates:
    quiet: true
    label: "Refresh candidates pool (random picks from _photos)"
    script: ~/gitrep/manipulating-photos/scripts/workflows/find-candidates.py
    params:
      count: {type: int, min: 3, max: 15, default: 5, flag: "--count"}
    flags:
      "--prefer-full-body": "Prefer full-body shots"
    wall_time_estimate_sec: 60
  auto-gen-tick:
    label: "Auto-generate (weighted by favorites; replaces the old auto loop)"
    script: ~/gitrep/manipulating-photos/scripts/workflows/auto_gen_tick.py
    output_dir_arg: "--local-output-dir"
    output_area: intermediates
    serialize: true
    params:
      count: {type: int, min: 1, max: 5, default: 1, flag: "--count"}
      daily-cap-usd: {type: float, min: 0.1, max: 10.0, default: 1.0, flag: "--daily-cap-usd"}
      tools: {type: str, flag: "--tools", description: "optional csv filter, e.g. ink-dissolution,color-bath", advanced: true}
    wall_time_estimate_sec: 180
notify:
  topic: hub-jobs
