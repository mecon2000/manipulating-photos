<!doctype html>
<html lang="en" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px; height: 1920px; overflow: hidden; background: #000;
        font-family: "Inter", system-ui, sans-serif;
      }
      .layer { position: absolute; inset: 0; }
      .layer img {
        position: absolute; inset: 0;
        width: 100%; height: 100%; object-fit: cover;
        transform-origin: 50% 31%;          /* the eye line, so scale pivots there */
      }
      /* the before/after pair are the same pixel-aligned frame, so a clip-path
         wipe between them reads as a real slider rather than a dissolve */
      #edited  { clip-path: inset(0 0 0 0); z-index: 3; }
      #unedit  { z-index: 2; }
      #bursts  { z-index: 1; }
      #bursts img { opacity: 0; }

      .chip {
        position: absolute; left: 50%; top: 82%;
        transform: translate(-50%, 0);
        padding: 18px 40px; border-radius: 999px;
        background: rgba(255,255,255,.93); color: #000;
        font-size: 40px; font-weight: 800; letter-spacing: .14em;
        text-transform: uppercase; white-space: nowrap;
        z-index: 12; opacity: 0;
      }
      .chip.dark { background: rgba(10,10,12,.88); color: #fff; }

      /* the seam that travels with the wipe */
      #seam {
        position: absolute; top: 0; bottom: 0; width: 5px;
        background: #fff; z-index: 6; opacity: 0; left: 0;
        will-change: transform;
        box-shadow: 0 0 26px rgba(255,255,255,.85);
      }
      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 9; }
      #vig {
        position: absolute; inset: 0; z-index: 5; pointer-events: none;
        background: radial-gradient(ellipse at 50% 38%,
                    rgba(0,0,0,0) 44%, rgba(0,0,0,.55) 100%);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.8"
         data-width="1080" data-height="1920">

      <div class="layer" id="bursts">
        <img id="b1" src="../assets/burst1.jpg" />
        <img id="b2" src="../assets/burst2.jpg" />
        <img id="b3" src="../assets/burst3.jpg" />
        <img id="b4" src="../assets/burst4.jpg" />
        <img id="b5" src="../assets/burst5.jpg" />
        <img id="b6" src="../assets/burst6.jpg" />
      </div>

      <div class="layer" id="unedit"><img src="../assets/unedited.jpg" /></div>
      <div class="layer" id="edited"><img src="../assets/edited.jpg" /></div>

      <div id="seam"></div>
      <div id="vig"></div>
      <div id="flash"></div>

      <div class="chip" id="chipEdited">edited</div>
      <div class="chip dark" id="chipUnedited">unedited</div>
    </div>

    <script>

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const B = ["#b1","#b2","#b3","#b4","#b5","#b6"];
      const IR = { immediateRender: false };

      // every cut arrives big and snaps down: the punch does the pacing
      const punch = (sel, at, d) =>
        tl.fromTo(sel, { scale: 1.22 },
                  { scale: 1, duration: d, ease: "power4.out", ...IR }, at);

      tl.set("#edited", { clipPath: "inset(0 0 0 0)" }, 0);
      punch("#edited img", 0, .55);
      tl.fromTo("#chipEdited", { opacity: 0, scale: .7 },
                { opacity: 1, scale: 1, duration: .26, ease: "back.out(3.4)", ...IR }, .06);
      tl.to("#chipEdited", { opacity: 0, duration: .1 }, .62);

      tl.set("#edited", { clipPath: "inset(0 100% 0 0)" }, .74);
      punch("#unedit img", .74, .42);
      tl.fromTo("#chipUnedited", { opacity: 0, scale: .7 },
                { opacity: 1, scale: 1, duration: .24, ease: "back.out(3.4)", ...IR }, .78);
      tl.to("#chipUnedited", { opacity: 0, duration: .1 }, 1.26);

      let t = 1.36, step = 0.10;
      for (let i = B.length - 1; i >= 0; i--) {
        tl.set(B[i], { opacity: 1 }, t);
        if (i !== B.length - 1) tl.set(B[i + 1], { opacity: 0 }, t);
        punch(B[i], t, step * 1.6);
        t += step;
      }
      tl.set("#b1", { opacity: 0 }, t);

      tl.set("#edited", { clipPath: "inset(0 0 0 0)" }, t);
      tl.fromTo("#flash", { opacity: .85 }, { opacity: 0, duration: .16, ease: "power2.out", ...IR }, t);
      punch("#edited img", t, 1.0);
      tl.fromTo("#chipEdited", { opacity: 0, scale: .75 },
                { opacity: 1, scale: 1, duration: .28, ease: "back.out(3.2)", ...IR }, t + .1);
      tl.to("#chipEdited", { opacity: 0, duration: .14 }, 3.55);
      window.__timelines["main"] = tl;

    </script>
  </body>
</html>
