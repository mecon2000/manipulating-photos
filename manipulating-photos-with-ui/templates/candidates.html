<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Candidates for motion streaks</title>
<style>
  :root {
    --bg: #0b0b0c; --fg: #e9e9ea; --dim: #9a9a9e;
    --ok: #5ecb8b; --danger: #ef5b5b; --warn: #b8851a;
    --panel: rgba(0,0,0,0.55);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overscroll-behavior: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { display: flex; flex-direction: column; height: 100vh; }
  .topbar, .bottombar { position: fixed; left: 0; right: 0; z-index: 10;
    background: var(--panel); backdrop-filter: blur(8px); padding: 10px 14px; font-size: 13px; }
  .topbar { top: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .bottombar { bottom: 0; padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
  .meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .meta .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta .sub { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .count { font-variant-numeric: tabular-nums; color: var(--dim); white-space: nowrap; }
  .photo-wrap { flex: 1; display: flex; align-items: center; justify-content: center;
    width: 100%; height: 100vh; position: relative; overflow: hidden; }
  .photo-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .empty { color: var(--dim); text-align: center; padding: 40px; }
  .btnrow { display: flex; gap: 6px; justify-content: space-between; }
  .btn { flex: 1 1 auto; min-width: 90px; padding: 14px 10px; border-radius: 8px;
    border: none; font-size: 15px; font-weight: 600; color: #fff; cursor: pointer; }
  .btn:active { transform: scale(0.97); }
  .btn-good { background: #2f7a3f; }
  .btn-bad  { background: #7a2929; }
  .btn-session { background: #4a1818; }
  .toast { position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
    background: var(--panel); color: var(--fg); padding: 8px 16px; border-radius: 20px;
    z-index: 20; font-size: 13px; opacity: 0; transition: opacity 0.2s; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="topbar">
  <div class="meta">
    <span class="title" id="title">Loading…</span>
    <span class="sub" id="sub">—</span>
  </div>
  <div class="count"><span id="idx">0</span>/<span id="queue">0</span> · <span id="saved">0</span> saved</div>
  {% with current="candidates" %}{% include "_modemenu.html" %}{% endwith %}
</div>

<div class="photo-wrap" id="photoWrap">
  <img id="photo" alt="" />
  <div class="empty" id="empty" style="display:none;">Waiting for previews…</div>
</div>

<div class="bottombar">
  <div style="color:var(--dim); font-size:11px; text-align:center; margin-bottom:6px;">
    ⚠️ Temporary page — collects source photos for the motion-streak pipeline.
  </div>
  <div class="btnrow">
    <button class="btn" style="background:#333; max-width:60px;" onclick="nav(-1)"
            title="Previous (←)">←</button>
    <button class="btn btn-bad" onclick="act('bad')"
            title="Reject — added to motion-streak rejects, won't be shown again  (b)">👎 Bad</button>
    <button class="btn btn-good" onclick="act('good')"
            title="Save this photo as a good source for motion-streak generation  (g)">✅ Good</button>
    <button class="btn btn-session" onclick="act('bad-session')"
            title="Blacklist the entire session — no photos from this shoot will appear again  (s)">🚫 Session</button>
    <button class="btn" style="background:#333; max-width:60px;" onclick="nav(1)"
            title="Next (→)">→</button>
  </div>
  <div class="btnrow" style="margin-top:6px;">
    <button class="btn" style="background:#c49a1a;" onclick="act('fav-as-is')"
            title="Favorite this B&W preview as-is — saves to favorites with reconstruction command  (f)">⭐ Fav as-is</button>
    <button class="btn" style="background:#2b5a8f;" onclick="openCrop()"
            title="Get 12 crop options, pick one or more, then fav the cropped result">✂️ Crop</button>
    <button class="btn" style="background:#1e5a7a;" onclick="act('similar')"
            title="Queue 4 adjacent photos from the same session for motion-streak preview">🔁 Similar photos</button>
  </div>
  <div style="display:flex; justify-content:center; margin-top:6px;">
    <button class="btn" id="pauseBtn" style="background:#555; max-width:120px;"
            onclick="togglePause()"
            title="Pause/resume the background picker that adds new candidates">⏸ Pause</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let items = [];
let current = null;
let acting = false;
let cursor = 0;

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1400);
}

async function refresh() {
  try {
    const [q, l] = await Promise.all([
      fetch('/api/candidates/queue').then(r => r.json()),
      fetch('/api/candidates/list').then(r => r.json()),
    ]);
    items = q.pending || [];
    document.getElementById('queue').textContent = items.length;
    document.getElementById('saved').textContent = (l.candidates || []).length;
    const paused = q.stats && q.stats.paused;
    document.getElementById('pauseBtn').textContent = paused ? '▶ Resume' : '⏸ Pause';
    render();
  } catch (e) { console.error(e); }
}

function render() {
  const img = document.getElementById('photo');
  const empty = document.getElementById('empty');
  document.getElementById('queue').textContent = items.length;
  if (!items.length) {
    current = null; cursor = 0;
    img.style.display = 'none';
    empty.style.display = 'block';
    document.getElementById('title').textContent = 'No candidates';
    document.getElementById('sub').textContent = '—';
    document.getElementById('idx').textContent = '0';
    return;
  }
  if (cursor >= items.length) cursor = items.length - 1;
  if (cursor < 0) cursor = 0;
  current = items[cursor];
  img.src = '/api/image?path=' + encodeURIComponent(current.output) + '&_=' + current.id;
  img.style.display = 'block';
  empty.style.display = 'none';
  document.getElementById('title').textContent = current.model || '?';
  document.getElementById('sub').textContent = (current.source || '').split('/').slice(-1)[0];
  document.getElementById('idx').textContent = (cursor + 1);
}

function nav(delta) {
  if (!items.length) return;
  cursor = (cursor + delta + items.length) % items.length;
  render();
}

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowLeft') nav(-1);
  else if (e.key === 'ArrowRight') nav(1);
  else if (e.key === 'b' || e.key === 'B') act('bad');
  else if (e.key === 'g' || e.key === 'G') act('good');
  else if (e.key === 'f' || e.key === 'F') act('fav-as-is');
  else if (e.key === 's' || e.key === 'S') act('bad-session');
});

async function act(kind) {
  if (!current || acting) return;
  acting = true;
  const id = current.id;
  try {
    const res = await fetch(`/api/candidates/${id}/${kind}`, {method: 'POST'});
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (kind === 'good') showToast(`Saved (${data.saved})`);
    else if (kind === 'bad') showToast('Rejected');
    else if (kind === 'bad-session') showToast(`Session blacklisted (-${data.removed})`);
    else if (kind === 'fav-as-is') showToast(`Favorited: ${data.file}`);
    else if (kind === 'similar') { showToast(`Queued ${data.queued} similar`); return; }
  } catch (e) {
    showToast('Error');
    console.error(e);
  } finally {
    acting = false;
    refresh();
  }
}

async function togglePause() {
  const label = document.getElementById('pauseBtn').textContent;
  const isPaused = label.includes('Resume');
  await fetch(isPaused ? '/api/candidates/resume' : '/api/candidates/pause', {method:'POST'});
  refresh();
}

refresh();
setInterval(refresh, 2000);
</script>

<div id="cropPanel" style="display:none; position:fixed; left:0; right:0;
     bottom:calc(220px + env(safe-area-inset-bottom)); z-index:30;
     background:rgba(15,15,18,0.96); border-top:1px solid #333; padding:10px 12px;">
  <div id="cropStatus" style="color:#bbb; font-size:12px; margin-bottom:6px;">Pick crops</div>
  <div id="cropChecks" style="display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin-bottom:8px;"></div>
  <div id="cropVariantStrip" style="display:none; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:8px;"></div>
  <div style="display:flex; gap:6px;">
    <button class="btn" style="background:#2a2a2e; flex:1;" onclick="cancelCrop()">Cancel</button>
    <button class="btn" id="cropApplyBtn" style="background:#b8851a; flex:2;" onclick="applyCrops()">Apply selection</button>
  </div>
</div>

<script>
let cropItemId = null;
let cropOriginalSrc = null;
let cropSelected = new Set();
let cropVariants = [];
let cropVariantIdx = 0;

async function openCrop() {
  if (!current) return;
  cropItemId = current.id;
  cropOriginalSrc = current.output;
  cropSelected.clear();
  cropVariants = [];
  cropVariantIdx = 0;

  const cc = document.getElementById('cropChecks');
  cc.innerHTML = '';
  for (let i = 1; i <= 12; i++) {
    const lbl = document.createElement('label');
    lbl.style.cssText = 'display:flex; align-items:center; justify-content:center; gap:4px; padding:8px; border:1px solid #444; border-radius:6px; font-size:14px; cursor:pointer; background:#1a1a1f; color:#e7e7ea;';
    lbl.innerHTML = `<input type="checkbox" value="${i}" onchange="onCropToggle(this)" style="margin:0;"> ${i}`;
    cc.appendChild(lbl);
  }
  document.getElementById('cropChecks').style.display = 'grid';
  document.getElementById('cropVariantStrip').style.display = 'none';
  const btn = document.getElementById('cropApplyBtn');
  btn.textContent = 'Apply selection';
  btn.onclick = applyCrops;
  btn.disabled = true;
  btn.style.opacity = '0.5';
  document.getElementById('cropPanel').style.display = 'block';
  document.getElementById('cropStatus').textContent = 'Generating crop options…';

  try {
    const r = await fetch(`/api/candidates/${cropItemId}/crop-options`, {method:'POST'});
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'failed');
    document.getElementById('photo').src = '/api/image?path=' + encodeURIComponent(d.options_path) + '&_=' + Date.now();
    document.getElementById('cropStatus').textContent = 'Pick one or more crops, then Apply.';
  } catch (e) {
    document.getElementById('cropStatus').textContent = 'Error: ' + e.message;
  }
}

function onCropToggle(cb) {
  const n = parseInt(cb.value, 10);
  if (cb.checked) cropSelected.add(n); else cropSelected.delete(n);
  const btn = document.getElementById('cropApplyBtn');
  btn.disabled = cropSelected.size === 0;
  btn.style.opacity = cropSelected.size === 0 ? '0.5' : '1';
}

async function applyCrops() {
  if (!cropItemId || cropSelected.size === 0) return;
  const crops = [...cropSelected].sort((a,b)=>a-b);
  document.getElementById('cropStatus').textContent = `Applying ${crops.length} crop(s)…`;
  document.getElementById('cropApplyBtn').disabled = true;
  try {
    const r = await fetch(`/api/candidates/${cropItemId}/crop-batch`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({crops})
    });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'failed');
    cropVariants = d.outputs;
    cropVariantIdx = 0;
    showCropVariant();
    renderCropStrip();
    document.getElementById('cropChecks').style.display = 'none';
    document.getElementById('cropVariantStrip').style.display = 'flex';
    const btn = document.getElementById('cropApplyBtn');
    btn.textContent = '⭐ Fav this crop';
    btn.disabled = false;
    btn.style.opacity = '1';
    btn.onclick = favCurrentCrop;
    document.getElementById('cropStatus').textContent = `${cropVariants.length} crop(s) ready. Tap thumbs to switch, then Fav.`;
  } catch (e) {
    document.getElementById('cropStatus').textContent = 'Error: ' + e.message;
    document.getElementById('cropApplyBtn').disabled = false;
  }
}

function renderCropStrip() {
  const strip = document.getElementById('cropVariantStrip');
  strip.innerHTML = '';
  cropVariants.forEach((v, i) => {
    const t = document.createElement('img');
    t.src = '/api/image?path=' + encodeURIComponent(v.path);
    t.style.cssText = `height:64px; width:auto; border-radius:4px; border:2px solid ${i===cropVariantIdx?'#ffb347':'#333'}; cursor:pointer; flex:0 0 auto;`;
    t.onclick = () => { cropVariantIdx = i; showCropVariant(); renderCropStrip(); };
    strip.appendChild(t);
  });
}

function showCropVariant() {
  const v = cropVariants[cropVariantIdx];
  if (!v) return;
  document.getElementById('photo').src = '/api/image?path=' + encodeURIComponent(v.path) + '&_=' + Date.now();
}

async function favCurrentCrop() {
  const v = cropVariants[cropVariantIdx];
  if (!v || !cropItemId) return;
  try {
    await fetch(`/api/candidates/${cropItemId}/set-output`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({path: v.path})
    });
    const r = await fetch(`/api/candidates/${cropItemId}/fav-as-is`, {method:'POST'});
    if (r.ok) showToast('Faved cropped!');
    closeCropPanel();
    refresh();
  } catch (e) { showToast('Error'); }
}

function cancelCrop() {
  if (cropOriginalSrc) {
    document.getElementById('photo').src = '/api/image?path=' + encodeURIComponent(cropOriginalSrc) + '&_=' + Date.now();
  }
  closeCropPanel();
}

function closeCropPanel() {
  document.getElementById('cropPanel').style.display = 'none';
  document.getElementById('cropChecks').style.display = 'grid';
  document.getElementById('cropApplyBtn').onclick = applyCrops;
  cropItemId = null;
  cropOriginalSrc = null;
  cropSelected.clear();
  cropVariants = [];
}
</script>

</body>
</html>
