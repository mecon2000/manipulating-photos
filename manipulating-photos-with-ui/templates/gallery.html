<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gallery</title>
<style>
  :root {
    --bg: #0b0b0c;
    --fg: #e9e9ea;
    --dim: #9a9a9e;
    --accent: #ffb347;
    --danger: #ef5b5b;
    --ok: #5ecb8b;
    --panel: rgba(0,0,0,0.55);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overscroll-behavior: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { display: flex; flex-direction: column; height: 100vh; }

  .topbar, .bottombar {
    position: fixed; left: 0; right: 0; z-index: 10;
    background: var(--panel); backdrop-filter: blur(8px);
    padding: 10px 14px; font-size: 13px;
  }
  .topbar { top: 0; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .bottombar { bottom: 0; padding-bottom: calc(10px + env(safe-area-inset-bottom)); }
  .meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .meta .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .meta .sub { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .navbtn { padding: 6px 10px; background: transparent; color: var(--fg);
    border: 1px solid #444; border-radius: 6px; font-size: 14px; }
  .count { font-variant-numeric: tabular-nums; color: var(--dim); white-space: nowrap;
    padding: 2px 8px; border-radius: 6px; border: 1px solid transparent; transition: all 0.15s; }
  .count.flash { border-color: var(--ok); color: var(--fg); box-shadow: 0 0 12px var(--ok);
    background: rgba(94,203,139,0.15); }
  .cost { font-variant-numeric: tabular-nums; font-size: 12px; color: var(--dim); white-space: nowrap; }
  .cost.over { color: var(--danger); font-weight: 600; }

  .photo-wrap { flex: 1; display: flex; align-items: center; justify-content: center;
    width: 100%; height: 100vh; position: relative; overflow: hidden; }
  .photo-wrap img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .photo-wrap.zoomed { overflow: auto; }
  .photo-wrap.zoomed img { max-width: none; max-height: none; }

  .empty { color: var(--dim); text-align: center; padding: 40px; }

  .btnrow { display: flex; gap: 6px; justify-content: space-between; flex-wrap: wrap; }
  .btn { flex: 1 1 auto; min-width: 90px; padding: 12px 10px; border-radius: 8px;
    border: none; font-size: 15px; font-weight: 600; color: #fff; cursor: pointer; }
  .btn:active { transform: scale(0.97); }
  .btn-dislike { background: #7a2929; }
  .btn-fav     { background: #b8851a; }
  .btn-edit    { background: #2b5a8f; }
  .btn-blacklist { background: #4a1818; }
  .btn-ghost   { background: #2a2a2e; color: var(--fg); }
  .btn-pause   { background: #3a3a40; }

  .second-row { display: flex; gap: 6px; margin-top: 8px; }
  .more-wrap { position: relative; flex: 2 1 auto; }
  .more-menu { position: absolute; bottom: 110%; left: 0; right: 0;
    background: #1c1c1f; border: 1px solid #333; border-radius: 8px;
    padding: 4px; display: none; }
  .more-menu.open { display: block; }
  .more-menu button { display: block; width: 100%; text-align: left;
    background: transparent; color: var(--fg); border: none; padding: 10px 12px;
    font-size: 14px; border-radius: 6px; }
  .more-menu button:hover, .more-menu button:active { background: #2a2a30; }

  .toast { position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
    background: var(--panel); color: var(--fg); padding: 8px 16px; border-radius: 20px;
    z-index: 20; font-size: 13px; opacity: 0; transition: opacity 0.2s; }
  .toast.show { opacity: 1; }

  /* Gallery view */
  .tabs { display: flex; gap: 4px; }
  .tab { padding: 6px 10px; font-size: 13px; background: transparent;
    color: var(--dim); border: 1px solid #444; border-radius: 6px; cursor: pointer; }
  .tab.active { color: var(--fg); background: #2a2a30; border-color: #666; }

  .gallery-view { display: none; padding: 60px 10px 80px; }
  .gallery-view.active { display: block; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; }
  .grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 4px; cursor: pointer; }
  .fav-detail { position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 30;
    display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
  .fav-detail.open { display: flex; }
  .fav-detail img { max-width: 100%; max-height: 70vh; object-fit: contain; }
  .fav-detail pre { background: #1a1a1d; color: #d0d0d0; padding: 10px; border-radius: 6px;
    max-width: 100%; overflow-x: auto; font-size: 11px; margin-top: 12px; }
  .fav-detail .close { position: absolute; top: 16px; right: 16px; font-size: 24px;
    background: transparent; color: #fff; border: none; }

  .review-view.hidden { display: none; }
</style>
</head>
<body>

<div class="topbar">
  <div class="meta" id="meta">
    <span class="title" id="title">Loading…</span>
    <span class="sub" id="sub">—</span>
  </div>
  <div style="display:flex; flex-direction:column; align-items:flex-end; gap:2px;">
    <div class="count" id="count">0 / 0</div>
    <div class="cost" id="cost">$0.00</div>
  </div>
  {% set extra_top %}
    <a href="#" onclick="switchView('gallery'); document.getElementById('modemenu').style.display='none'; return false;"
       style="display:block; padding:10px 14px; color:#e7e7ea; text-decoration:none; border-bottom:1px solid #2a2a30;">⭐ Favs</a>
  {% endset %}
  {% with current="gallery", extra_top=extra_top %}{% include "_modemenu.html" %}{% endwith %}
</div>

<div class="review-view" id="reviewView" style="flex:1; display:flex; flex-direction:column;">
  <div class="photo-wrap" id="photoWrap">
    <img id="photo" alt="" />
    <div class="empty" id="empty" style="display:none;">Waiting for photos…</div>
  </div>
</div>

<div class="gallery-view" id="galleryView">
  <div class="grid" id="favGrid"></div>
</div>

<div class="bottombar review-view" id="bottombar">
  <div class="btnrow">
    <button class="btn btn-dislike" onclick="act('dislike')" title="Delete this output  (b or d)">👎 Delete</button>
    <button class="btn btn-fav"     onclick="act('like')"    title="Save to favorites with reconstruction command  (f or g)">⭐ Fav</button>
    <button class="btn btn-edit"    onclick="act('edit')"    title="Move to edit-later folder for AI discussion  (e)">✏️ Edit</button>
    <button class="btn btn-edit"    onclick="openCrop()"     title="Get 12 crop options, pick one, then fav the cropped result  (c)">✂️ Crop</button>
    <button class="btn btn-blacklist" onclick="act('blacklist')" title="Blacklist this session — never show again  (s)">🚫 Session</button>
  </div>
  <div class="second-row">
    <button class="navbtn" onclick="nav(-1)">←</button>
    <div class="more-wrap">
      <button class="btn btn-ghost" onclick="toggleMore()">▶ More Like This ▼</button>
      <div class="more-menu" id="moreMenu">
        <button onclick="more('same-style')">Same style, 4 diff photos</button>
        <button onclick="more('same-photo')">Same photo, 4 diff styles</button>
        <button onclick="more('similar')">Similar photos, same style</button>
      </div>
    </div>
    <button class="btn btn-pause" id="pauseBtn" onclick="togglePause()">⏸</button>
    <button class="navbtn" onclick="nav(1)">→</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="fav-detail" id="favDetail">
  <button class="close" onclick="closeFav()">✕</button>
  <img id="favDetailImg" />
  <div id="favDetailMeta" style="color:#bbb; margin-top:10px; font-size:12px;"></div>
  <pre id="favDetailCmd"></pre>
</div>

<script>
let items = [];
let idx = 0;
let paused = false;
let zoomed = false;
let currentView = 'review';
let lastSeenIds = new Set();

function toast(msg, kind) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.borderLeft = kind === 'err' ? '3px solid var(--danger)' : kind === 'ok' ? '3px solid var(--ok)' : 'none';
  t.classList.add('show');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove('show'), 1500);
}

async function refresh() {
  try {
    const r = await fetch('/api/queue');
    const data = await r.json();
    const newItems = data.pending || [];
    const curId = items[idx] && items[idx].id;

    // Detect newly arrived items (flash the counter)
    const newIds = new Set(newItems.map(it => it.id));
    let hasNew = false;
    for (const id of newIds) if (!lastSeenIds.has(id)) { hasNew = true; break; }
    if (hasNew && lastSeenIds.size > 0) flashCount();
    lastSeenIds = newIds;

    items = newItems;
    paused = !!(data.stats && data.stats.paused);
    document.getElementById('pauseBtn').textContent = paused ? '▶' : '⏸';

    // Cost-today display
    const cost = (data.stats && data.stats.cost_today) || 0;
    const costEl = document.getElementById('cost');
    costEl.textContent = '$' + cost.toFixed(2) + ' today';
    costEl.classList.toggle('over', cost > 2);

    if (curId) {
      const ni = items.findIndex(it => it.id === curId);
      idx = ni >= 0 ? ni : Math.min(idx, Math.max(0, items.length - 1));
    } else {
      idx = Math.min(idx, Math.max(0, items.length - 1));
    }
    render();
  } catch (e) { /* ignore */ }
}

function render() {
  const img = document.getElementById('photo');
  const empty = document.getElementById('empty');
  const count = document.getElementById('count');

  if (!items.length) {
    img.style.display = 'none';
    empty.style.display = 'block';
    document.getElementById('title').textContent = paused ? 'Paused' : 'Waiting for photos…';
    document.getElementById('sub').textContent = '—';
    count.textContent = '0 / 0';
    return;
  }
  empty.style.display = 'none';
  img.style.display = '';
  const it = items[idx];
  img.src = '/api/image?path=' + encodeURIComponent(it.output) + '&t=' + Date.now();
  document.getElementById('title').textContent = it.model + ' — ' + filename(it.source);
  const bits = [it.tool, it.preset, it.artifact].filter(Boolean).join(' · ');
  document.getElementById('sub').textContent = bits;
  count.textContent = (idx + 1) + ' / ' + items.length;
}

function filename(p) { return (p || '').split('/').pop(); }

function flashCount() {
  const c = document.getElementById('count');
  c.classList.remove('flash');
  void c.offsetWidth;
  c.classList.add('flash');
  setTimeout(() => c.classList.remove('flash'), 800);
}

function nav(delta) {
  if (!items.length) return;
  idx = (idx + delta + items.length) % items.length;
  zoomed = false;
  document.getElementById('photoWrap').classList.remove('zoomed');
  render();
}

async function act(kind) {
  if (!items.length) return;
  const it = items[idx];
  const endpoint = kind;
  const model = it.model;
  try {
    const r = await fetch('/api/queue/' + it.id + '/' + endpoint, { method: 'POST' });
    const msg = kind === 'like' ? 'Faved!'
              : kind === 'edit' ? 'Saved for edit'
              : kind === 'blacklist' ? ('Blacklisted ' + model)
              : 'Deleted';
    if (r.ok) toast(msg, 'ok');
    // For blacklist the server removed all items from that model; refetch.
    if (kind === 'blacklist') {
      await refresh();
      return;
    }
    items.splice(idx, 1);
    if (idx >= items.length) idx = Math.max(0, items.length - 1);
    render();
    refresh();
  } catch (e) { toast('Error', 'err'); }
}

async function more(kind) {
  if (!items.length) return;
  const it = items[idx];
  document.getElementById('moreMenu').classList.remove('open');
  try {
    const r = await fetch('/api/queue/' + it.id + '/more/' + kind, { method: 'POST' });
    const data = await r.json();
    toast('Queued ' + (data.queued || 0) + ' more', 'ok');
  } catch (e) { toast('Error', 'err'); }
}

function toggleMore() {
  document.getElementById('moreMenu').classList.toggle('open');
}

async function togglePause() {
  const endpoint = paused ? 'resume' : 'pause';
  await fetch('/api/' + endpoint, { method: 'POST' });
  paused = !paused;
  document.getElementById('pauseBtn').textContent = paused ? '▶' : '⏸';
  toast(paused ? 'Paused' : 'Resumed');
}

// Keyboard
document.addEventListener('keydown', (e) => {
  if (currentView !== 'review') return;
  if (e.key === 'ArrowLeft')  nav(-1);
  else if (e.key === 'ArrowRight') nav(1);
  else if (e.key === 'f' || e.key === 'g') act('like');
  else if (e.key === 'd' || e.key === 'b') act('dislike');
  else if (e.key === 'e') act('edit');
  else if (e.key === 'c') openCrop();
  else if (e.key === 's') act('blacklist');
  else if (e.key === ' ') { e.preventDefault(); togglePause(); }
  else if (e.key === 'm') toggleMore();
  else if (e.key === '1') more('same-style');
  else if (e.key === '2') more('same-photo');
  else if (e.key === '3') more('similar');
});

// Click to zoom
document.getElementById('photo').addEventListener('click', () => {
  zoomed = !zoomed;
  document.getElementById('photoWrap').classList.toggle('zoomed', zoomed);
});

// View switch
function switchView(v) {
  currentView = v;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.view === v));
  document.getElementById('reviewView').classList.toggle('hidden', v !== 'review');
  document.getElementById('bottombar').classList.toggle('hidden', v !== 'review');
  document.getElementById('galleryView').classList.toggle('active', v === 'gallery');
  if (v === 'gallery') loadFavorites();
}

async function loadFavorites() {
  const r = await fetch('/api/favorites');
  const data = await r.json();
  const grid = document.getElementById('favGrid');
  grid.innerHTML = '';
  (data.favorites || []).slice().reverse().forEach(f => {
    const img = document.createElement('img');
    img.src = '/api/image?path=' + encodeURIComponent('~/.openclaw/workspace/shared/favorites/' + f.file);
    img.loading = 'lazy';
    img.onclick = () => openFav(f);
    grid.appendChild(img);
  });
}

function openFav(f) {
  document.getElementById('favDetailImg').src =
    '/api/image?path=' + encodeURIComponent('~/.openclaw/workspace/shared/favorites/' + f.file);
  document.getElementById('favDetailMeta').textContent =
    [f.model, f.tool, f.style, f.favorited_at].filter(Boolean).join(' · ');
  document.getElementById('favDetailCmd').textContent = f.command || '';
  document.getElementById('favDetail').classList.add('open');
}
function closeFav() { document.getElementById('favDetail').classList.remove('open'); }

// Close more-menu on outside click
document.addEventListener('click', (e) => {
  const menu = document.getElementById('moreMenu');
  if (!menu.parentElement.contains(e.target)) menu.classList.remove('open');
});

refresh();
setInterval(refresh, 3000);
</script>
<div id="cropPanel" style="display:none; position:fixed; left:0; right:0;
     bottom:calc(180px + env(safe-area-inset-bottom)); z-index:30;
     background:rgba(15,15,18,0.96); border-top:1px solid #333; padding:10px 12px;">
  <div id="cropStatus" style="color:#bbb; font-size:12px; margin-bottom:6px;">Pick crops</div>
  <div id="cropChecks" style="display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin-bottom:8px;"></div>
  <div id="cropVariantStrip" style="display:none; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:8px;"></div>
  <div style="display:flex; gap:6px;">
    <button class="btn btn-ghost" onclick="cancelCrop()" style="flex:1;">Cancel</button>
    <button class="btn btn-fav" id="cropApplyBtn" onclick="applyCrops()" style="flex:2;">Apply selection</button>
  </div>
</div>
<script>
let cropItemId = null;
let cropOriginalSrc = null;
let cropSelected = new Set();
let cropVariants = []; // [{n, path}]
let cropVariantIdx = 0;
let cropMode = 'idle'; // idle | options | variants

async function openCrop() {
  if (!items.length) return;
  const it = items[idx];
  cropItemId = it.id;
  cropOriginalSrc = it.output;
  cropSelected.clear();
  cropVariants = [];
  cropVariantIdx = 0;
  cropMode = 'options';

  // Render checkbox grid 1..12
  const cc = document.getElementById('cropChecks');
  cc.innerHTML = '';
  for (let i = 1; i <= 12; i++) {
    const lbl = document.createElement('label');
    lbl.style.cssText = 'display:flex; align-items:center; justify-content:center; gap:4px; padding:8px; border:1px solid #444; border-radius:6px; font-size:14px; cursor:pointer; background:#1a1a1f;';
    lbl.innerHTML = `<input type="checkbox" value="${i}" onchange="onCropToggle(this)" style="margin:0;"> ${i}`;
    cc.appendChild(lbl);
  }
  document.getElementById('cropVariantStrip').style.display = 'none';
  document.getElementById('cropApplyBtn').textContent = 'Apply selection';
  document.getElementById('cropApplyBtn').disabled = true;
  document.getElementById('cropApplyBtn').style.opacity = '0.5';
  document.getElementById('cropPanel').style.display = 'block';
  document.getElementById('cropStatus').textContent = 'Generating crop options…';

  try {
    const r = await fetch(`/api/queue/${cropItemId}/crop-options`, {method:'POST'});
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'failed');
    document.getElementById('photo').src = '/api/image?path=' + encodeURIComponent(d.options_path) + '&_=' + Date.now();
    document.getElementById('cropStatus').textContent = 'Pick one or more crops, then Apply.';
  } catch (e) {
    document.getElementById('cropStatus').textContent = 'Error: ' + e.message;
  }
}

function onCropToggle(cb) {
  const n = parseInt(cb.value, 10);
  if (cb.checked) cropSelected.add(n); else cropSelected.delete(n);
  const btn = document.getElementById('cropApplyBtn');
  btn.disabled = cropSelected.size === 0;
  btn.style.opacity = cropSelected.size === 0 ? '0.5' : '1';
}

async function applyCrops() {
  if (!cropItemId || cropSelected.size === 0) return;
  const crops = [...cropSelected].sort((a,b)=>a-b);
  document.getElementById('cropStatus').textContent = `Applying ${crops.length} crop(s)…`;
  document.getElementById('cropApplyBtn').disabled = true;
  try {
    const r = await fetch(`/api/queue/${cropItemId}/crop-batch`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({crops})
    });
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'failed');
    cropVariants = d.outputs;
    cropVariantIdx = 0;
    cropMode = 'variants';
    showCropVariant();
    renderCropStrip();
    document.getElementById('cropChecks').style.display = 'none';
    document.getElementById('cropVariantStrip').style.display = 'flex';
    const btn = document.getElementById('cropApplyBtn');
    btn.textContent = '⭐ Fav this crop';
    btn.disabled = false;
    btn.style.opacity = '1';
    btn.onclick = favCurrentCrop;
    document.getElementById('cropStatus').textContent = `${cropVariants.length} crop(s) ready. Tap thumbs to switch, then Fav.`;
  } catch (e) {
    document.getElementById('cropStatus').textContent = 'Error: ' + e.message;
    document.getElementById('cropApplyBtn').disabled = false;
  }
}

function renderCropStrip() {
  const strip = document.getElementById('cropVariantStrip');
  strip.innerHTML = '';
  cropVariants.forEach((v, i) => {
    const t = document.createElement('img');
    t.src = '/api/image?path=' + encodeURIComponent(v.path);
    t.style.cssText = `height:64px; width:auto; border-radius:4px; border:2px solid ${i===cropVariantIdx?'#ffb347':'#333'}; cursor:pointer; flex:0 0 auto;`;
    t.onclick = () => { cropVariantIdx = i; showCropVariant(); renderCropStrip(); };
    strip.appendChild(t);
  });
}

function showCropVariant() {
  const v = cropVariants[cropVariantIdx];
  if (!v) return;
  document.getElementById('photo').src = '/api/image?path=' + encodeURIComponent(v.path) + '&_=' + Date.now();
}

async function favCurrentCrop() {
  const v = cropVariants[cropVariantIdx];
  if (!v || !cropItemId) return;
  try {
    // Mutate item's output to chosen crop, then call standard like endpoint.
    await fetch(`/api/queue/${cropItemId}/set-output`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({path: v.path, suffix: `--crop ${v.n}`})
    });
    const r = await fetch(`/api/queue/${cropItemId}/like`, {method:'POST'});
    if (r.ok) toast('Faved cropped!', 'ok');
    closeCropPanel();
    items.splice(idx, 1);
    if (idx >= items.length) idx = Math.max(0, items.length - 1);
    render();
    refresh();
  } catch (e) { toast('Error', 'err'); }
}

function cancelCrop() {
  // Restore original photo
  if (cropOriginalSrc) {
    document.getElementById('photo').src = '/api/image?path=' + encodeURIComponent(cropOriginalSrc) + '&t=' + Date.now();
  }
  closeCropPanel();
}

function closeCropPanel() {
  document.getElementById('cropPanel').style.display = 'none';
  document.getElementById('cropChecks').style.display = 'grid';
  document.getElementById('cropApplyBtn').onclick = applyCrops;
  cropItemId = null;
  cropOriginalSrc = null;
  cropSelected.clear();
  cropVariants = [];
  cropMode = 'idle';
}
</script>
</body>
</html>
