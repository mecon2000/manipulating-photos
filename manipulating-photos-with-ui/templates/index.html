<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OpenClaw</title>
<style>
  :root {
    --bg: #0b0b0c;
    --fg: #e9e9ea;
    --dim: #9a9a9e;
    --accent: #ffb347;
    --danger: #ef5b5b;
    --ok: #5ecb8b;
    --panel: rgba(0,0,0,0.55);
    --border: #2a2a2e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent; }
  body { display: flex; flex-direction: column; min-height: 100vh; }

  .tabbar {
    position: sticky; top: 0; z-index: 50;
    display: flex; gap: 4px; padding: 8px;
    background: var(--panel); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .tabbtn {
    flex: 1 1 auto; min-width: 0;
    padding: 10px 8px;
    background: transparent; color: var(--fg);
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 14px; font-weight: 500;
    cursor: pointer; white-space: nowrap;
    transition: background 0.15s, border-color 0.15s;
  }
  .tabbtn:hover { background: rgba(255,255,255,0.04); }
  .tabbtn.active {
    background: rgba(255,179,71,0.15);
    border-color: var(--accent);
    color: var(--accent);
  }
  .tabbtn .label { display: none; }

  main { flex: 1; padding: 16px; }
  section { display: none; }
  section.active { display: block; }
  section h2 { margin: 0 0 12px; font-size: 20px; font-weight: 600; }
  section p.placeholder { color: var(--dim); font-size: 14px; }

  @media (min-width: 700px) {
    .tabbar { padding: 10px 14px; gap: 8px; }
    .tabbtn { flex: 0 1 auto; padding: 10px 18px; font-size: 15px; }
    .tabbtn .label { display: inline; margin-left: 6px; }
    main { padding: 24px; max-width: 1400px; margin: 0 auto; width: 100%; }
    section h2 { font-size: 24px; }
  }

  /* Candidates tab */
  .filter-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
  .pill {
    padding: 6px 12px; border-radius: 999px;
    background: transparent; color: var(--fg);
    border: 1px solid var(--border); cursor: pointer;
    font-size: 13px; white-space: nowrap;
  }
  .pill.active { background: rgba(255,179,71,0.18); border-color: var(--accent); color: var(--accent); }
  .pill .count { color: var(--dim); margin-left: 4px; font-size: 11px; }

  .cand-grid {
    display: grid; gap: 10px;
    grid-template-columns: repeat(2, 1fr);
  }
  @media (min-width: 700px) {
    .cand-grid { grid-template-columns: repeat(4, 1fr); gap: 14px; }
  }

  .cand-card {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .cand-card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(255,179,71,0.3); }
  .cand-thumb {
    aspect-ratio: 1 / 1; width: 100%;
    background: #000; cursor: zoom-in;
    overflow: hidden; position: relative;
  }
  .cand-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .cand-checkbox {
    position: absolute; top: 6px; right: 6px;
    width: 26px; height: 26px;
    background: rgba(0,0,0,0.65); border: 1px solid var(--border);
    border-radius: 6px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; user-select: none; z-index: 2;
  }
  .cand-card.selected .cand-checkbox { background: var(--accent); color: #000; border-color: var(--accent); }

  .cand-chips {
    position: absolute; top: 6px; left: 6px;
    display: flex; gap: 4px; flex-wrap: wrap; z-index: 2;
  }
  .chip {
    background: rgba(0,0,0,0.7); border: 1px solid var(--border);
    border-radius: 999px; padding: 2px 7px; font-size: 11px;
  }
  .chip-wm { background: rgba(239,91,91,0.85); border-color: var(--danger); color: #fff; cursor: help; }

  .cand-meta { padding: 6px 8px 4px; font-size: 11px; }
  .cand-name { color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cand-model { color: var(--dim); font-size: 10px; }

  .cand-actions {
    display: flex; gap: 4px; padding: 6px 8px 8px;
  }
  .btn {
    flex: 1; padding: 6px 4px;
    background: transparent; color: var(--fg);
    border: 1px solid var(--border); border-radius: 6px;
    font-size: 11px; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { background: rgba(255,255,255,0.05); }
  .btn.face-yes { border-color: var(--ok); color: var(--ok); }
  .btn.face-no { border-color: var(--danger); color: var(--danger); }

  .lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,0.95);
    z-index: 100; display: none;
    align-items: center; justify-content: center;
    flex-direction: column;
  }
  .lightbox.show { display: flex; }
  .lightbox img { max-width: 96vw; max-height: 88vh; object-fit: contain; }
  .lightbox-bar {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 12px 16px; display: flex; gap: 8px;
    justify-content: space-between; align-items: center;
    background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
  }
  .lightbox-bar .close { font-size: 24px; cursor: pointer; }
  .lightbox-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(0,0,0,0.5); border: 1px solid var(--border);
    color: #fff; font-size: 28px; padding: 8px 14px; cursor: pointer;
    border-radius: 6px;
  }
  .lightbox-nav.prev { left: 12px; }
  .lightbox-nav.next { right: 12px; }

  .crop-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.92);
    z-index: 110; display: none;
    align-items: center; justify-content: center; flex-direction: column;
    padding: 16px;
  }
  .crop-modal.show { display: flex; }
  .crop-modal img { max-width: 100%; max-height: 70vh; object-fit: contain; }
  .crop-modal input { padding: 8px; margin: 10px 0; background: var(--panel);
    color: var(--fg); border: 1px solid var(--border); border-radius: 6px;
    font-size: 16px; width: 200px; text-align: center; }
  .crop-modal .row { display: flex; gap: 8px; }
  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--border);
    padding: 10px 16px; border-radius: 8px; font-size: 13px;
    z-index: 200; backdrop-filter: blur(8px);
    display: none;
  }
  .toast.show { display: block; }
</style>
</head>
<body>
  <nav class="tabbar" role="tablist">
    <button class="tabbtn" data-tab="candidates" role="tab">📋<span class="label">Candidates</span></button>
    <button class="tabbtn" data-tab="run" role="tab">🎬<span class="label">Run</span></button>
    <button class="tabbtn" data-tab="vote" role="tab">🗳<span class="label">Vote</span></button>
    <button class="tabbtn" data-tab="favs" role="tab">⭐<span class="label">Favs</span></button>
    <button class="tabbtn" data-tab="tree" role="tab">🌳<span class="label">Tree</span></button>
  </nav>

  <main>
    <section id="tab-candidates" role="tabpanel">
      <div style="display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;">
        <h2 style="margin:0 0 12px;">📋 Candidates</h2>
        <span id="cand-count" style="color:var(--dim); font-size:13px;"></span>
      </div>
      <div class="filter-row" id="cand-filters">
        <button class="pill active" data-filter="all">all</button>
        <button class="pill" data-filter="clear">🟢 clear face</button>
        <button class="pill" data-filter="partial">🟡 partial face</button>
        <button class="pill" data-filter="none">🔴 no face</button>
        <button class="pill" data-filter="watermark">🛂 watermark</button>
        <button class="pill" data-filter="selected">✓ selected</button>
      </div>
      <div class="cand-grid" id="cand-grid"></div>
    </section>

    <div id="cand-lightbox" class="lightbox">
      <div class="lightbox-bar">
        <span id="lb-name" style="font-size:13px;"></span>
        <span class="close" id="lb-close">✕</span>
      </div>
      <button class="lightbox-nav prev" id="lb-prev">‹</button>
      <img id="lb-img" src="">
      <button class="lightbox-nav next" id="lb-next">›</button>
    </div>

    <div id="crop-modal" class="crop-modal">
      <img id="crop-img" src="">
      <div style="margin-top:8px;">Pick crop number (1-12):</div>
      <input id="crop-num" type="number" min="1" max="12" placeholder="1-12">
      <div class="row">
        <button class="btn" id="crop-apply" style="background:var(--accent); color:#000; border-color:var(--accent); padding:8px 16px;">Apply</button>
        <button class="btn" id="crop-cancel" style="padding:8px 16px;">Cancel</button>
      </div>
    </div>

    <div id="toast" class="toast"></div>
    <section id="tab-run" role="tabpanel">
      <h2>🎬 Run</h2>
      <p class="placeholder">Run tab — content lands in phase 3.</p>
    </section>
    <section id="tab-vote" role="tabpanel">
      <h2>🗳 Vote</h2>
      <p class="placeholder">Vote tab — content lands in phase 5.</p>
    </section>
    <section id="tab-favs" role="tabpanel">
      <h2>⭐ Favs</h2>
      <p class="placeholder">Favs tab — content lands in phase 6.</p>
    </section>
    <section id="tab-tree" role="tabpanel">
      <h2>🌳 Tree</h2>
      <p class="placeholder">Tree tab — port from /tree in a later phase. (Direct link still works at <a href="/tree" style="color: var(--accent);">/tree</a>.)</p>
    </section>
  </main>

<script>
  const TABS = ["candidates", "run", "vote", "favs", "tree"];

  function currentTab() {
    const h = (location.hash || "").replace(/^#/, "");
    return TABS.includes(h) ? h : "candidates";
  }

  function showTab(name) {
    if (!TABS.includes(name)) name = "candidates";
    for (const t of TABS) {
      const sec = document.getElementById("tab-" + t);
      if (sec) sec.classList.toggle("active", t === name);
    }
    document.querySelectorAll(".tabbtn").forEach(b => {
      b.classList.toggle("active", b.dataset.tab === name);
    });
  }

  function navigate(name) {
    if (location.hash.replace(/^#/, "") === name) {
      showTab(name);
    } else {
      location.hash = name;
    }
  }

  document.querySelectorAll(".tabbtn").forEach(b => {
    b.addEventListener("click", () => navigate(b.dataset.tab));
  });

  window.addEventListener("hashchange", () => showTab(currentTab()));

  document.addEventListener("keydown", e => {
    if (e.target && e.target.tagName === "INPUT") return;
    if (e.target && e.target.tagName === "TEXTAREA") return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const idx = ["1","2","3","4","5"].indexOf(e.key);
    if (idx >= 0) {
      e.preventDefault();
      navigate(TABS[idx]);
    }
  });

  showTab(currentTab());

  // ---- Candidates tab ----
  const SEL_KEY = "selectedCandidates";
  function loadSelected() {
    try { return new Set(JSON.parse(localStorage.getItem(SEL_KEY) || "[]")); }
    catch { return new Set(); }
  }
  function saveSelected(s) {
    localStorage.setItem(SEL_KEY, JSON.stringify(Array.from(s)));
  }
  const selected = loadSelected();
  let candState = { items: [], filter: "all" };

  function imgUrl(path) { return "/api/image?path=" + encodeURIComponent(path); }
  function parseModel(fn) {
    const m = fn.match(/^([^_]+)__/);
    return m ? m[1] : "";
  }
  function faceChip(q) {
    if (q === "clear") return "🟢";
    if (q === "partial") return "🟡";
    return "🔴";
  }
  function showToast(msg, ms=2200) {
    const t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => t.classList.remove("show"), ms);
  }

  function passesFilter(c) {
    const f = candState.filter;
    if (f === "all") return true;
    if (f === "clear") return c.face_quality === "clear";
    if (f === "partial") return c.face_quality === "partial";
    if (f === "none") return c.face_quality === "none";
    if (f === "watermark") return !!(c.watermark && c.watermark.has_watermark);
    if (f === "selected") return selected.has(c.filename);
    return true;
  }

  let wmObserver = null;
  function ensureWmObserver() {
    if (wmObserver) return wmObserver;
    wmObserver = new IntersectionObserver((entries) => {
      for (const e of entries) {
        if (e.isIntersecting) {
          const card = e.target;
          wmObserver.unobserve(card);
          fetchWatermark(card.dataset.filename, card);
        }
      }
    }, { rootMargin: "200px" });
    return wmObserver;
  }

  const wmFetched = new Set();
  async function fetchWatermark(fn, card) {
    if (wmFetched.has(fn)) return;
    wmFetched.add(fn);
    try {
      const r = await fetch(`/api/pipeline/candidate/${encodeURIComponent(fn)}/watermark`);
      if (!r.ok) return;
      const j = await r.json();
      const wm = j.watermark;
      if (!wm) return;
      // update state and card
      const item = candState.items.find(c => c.filename === fn);
      if (item) item.watermark = wm;
      if (wm.has_watermark) {
        const chips = card.querySelector(".cand-chips");
        if (chips && !chips.querySelector(".chip-wm")) {
          const span = document.createElement("span");
          span.className = "chip chip-wm";
          span.textContent = "🛂";
          span.title = `Watermark: ${wm.text || "?"} (${wm.location || "?"})`;
          chips.appendChild(span);
        }
      }
    } catch {}
  }

  function renderCandidates() {
    const grid = document.getElementById("cand-grid");
    grid.innerHTML = "";
    const visible = candState.items.filter(passesFilter);
    document.getElementById("cand-count").textContent =
      `${visible.length} / ${candState.items.length}`;
    const obs = ensureWmObserver();
    for (const c of visible) {
      const card = document.createElement("div");
      card.className = "cand-card" + (selected.has(c.filename) ? " selected" : "");
      card.dataset.filename = c.filename;

      const wmChip = c.watermark && c.watermark.has_watermark
        ? `<span class="chip chip-wm" title="Watermark: ${(c.watermark.text||'?').replace(/"/g,'&quot;')} (${(c.watermark.location||'?').replace(/"/g,'&quot;')})">🛂</span>`
        : "";

      card.innerHTML = `
        <div class="cand-thumb" data-act="open">
          <div class="cand-chips">
            <span class="chip">${faceChip(c.face_quality)}</span>
            ${wmChip}
          </div>
          <div class="cand-checkbox" data-act="select">${selected.has(c.filename) ? "✓" : ""}</div>
          <img loading="lazy" src="${imgUrl(c.path)}" alt="">
        </div>
        <div class="cand-meta">
          <div class="cand-name" title="${c.filename}">${c.filename}</div>
          <div class="cand-model">${parseModel(c.filename)}</div>
        </div>
        <div class="cand-actions">
          <button class="btn ${c.has_face ? 'face-yes' : 'face-no'}" data-act="face">
            ${c.has_face ? "✅ has face" : "🚫 no face"}
          </button>
          <button class="btn" data-act="crop">✂️ Crop</button>
        </div>
      `;

      card.addEventListener("click", (ev) => {
        const t = ev.target.closest("[data-act]");
        const act = t ? t.dataset.act : null;
        if (act === "select") {
          ev.stopPropagation();
          toggleSelect(c.filename);
        } else if (act === "face") {
          ev.stopPropagation();
          toggleFace(c);
        } else if (act === "crop") {
          ev.stopPropagation();
          openCrop(c);
        } else if (act === "open") {
          openLightbox(c);
        }
      });

      grid.appendChild(card);
      // Lazy watermark observation (only if not already known)
      if (!c.watermark) obs.observe(card);
    }
  }

  function toggleSelect(fn) {
    if (selected.has(fn)) selected.delete(fn);
    else selected.add(fn);
    saveSelected(selected);
    renderCandidates();
  }

  async function toggleFace(c) {
    const newVal = !c.has_face;
    try {
      const r = await fetch(`/api/pipeline/candidate/${encodeURIComponent(c.filename)}/face`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({has_face: newVal})
      });
      if (!r.ok) throw new Error("bad");
      c.has_face = newVal;
      renderCandidates();
    } catch {
      showToast("Failed to set has_face");
    }
  }

  // Crop modal state
  let cropTarget = null;
  async function openCrop(c) {
    cropTarget = c;
    showToast("Generating crop options…");
    try {
      const r = await fetch(`/api/pipeline/candidate/${encodeURIComponent(c.filename)}/crop-options`,
        { method: "POST" });
      const j = await r.json();
      if (!j.ok) { showToast("Crop options failed"); return; }
      document.getElementById("crop-img").src = imgUrl(j.options_path);
      document.getElementById("crop-num").value = "";
      document.getElementById("crop-modal").classList.add("show");
    } catch {
      showToast("Crop options failed");
    }
  }
  document.getElementById("crop-cancel").addEventListener("click", () => {
    document.getElementById("crop-modal").classList.remove("show");
    cropTarget = null;
  });
  document.getElementById("crop-apply").addEventListener("click", async () => {
    const n = parseInt(document.getElementById("crop-num").value, 10);
    if (!n || !cropTarget) return;
    const fn = cropTarget.filename;
    showToast("Applying crop " + n + "…");
    try {
      const r = await fetch(`/api/pipeline/candidate/${encodeURIComponent(fn)}/crop/${n}`,
        { method: "POST" });
      const j = await r.json();
      if (!j.ok) { showToast("Crop failed: " + (j.error||"")); return; }
      document.getElementById("crop-modal").classList.remove("show");
      cropTarget = null;
      showToast("Cropped");
      // Reload to refresh face quality + thumbnail cache buster
      loadCandidates();
    } catch {
      showToast("Crop failed");
    }
  });

  // Lightbox
  let lbIdx = 0;
  function openLightbox(c) {
    const visible = candState.items.filter(passesFilter);
    lbIdx = visible.findIndex(x => x.filename === c.filename);
    if (lbIdx < 0) lbIdx = 0;
    showLb(visible);
    document.getElementById("cand-lightbox").classList.add("show");
  }
  function showLb(visible) {
    const c = visible[lbIdx];
    if (!c) return;
    document.getElementById("lb-img").src = imgUrl(c.path);
    document.getElementById("lb-name").textContent = c.filename;
  }
  document.getElementById("lb-close").addEventListener("click", () => {
    document.getElementById("cand-lightbox").classList.remove("show");
  });
  document.getElementById("lb-prev").addEventListener("click", () => {
    const v = candState.items.filter(passesFilter);
    if (!v.length) return;
    lbIdx = (lbIdx - 1 + v.length) % v.length; showLb(v);
  });
  document.getElementById("lb-next").addEventListener("click", () => {
    const v = candState.items.filter(passesFilter);
    if (!v.length) return;
    lbIdx = (lbIdx + 1) % v.length; showLb(v);
  });
  document.addEventListener("keydown", (e) => {
    const lb = document.getElementById("cand-lightbox");
    if (!lb.classList.contains("show")) return;
    if (e.key === "Escape") lb.classList.remove("show");
    else if (e.key === "ArrowLeft") document.getElementById("lb-prev").click();
    else if (e.key === "ArrowRight") document.getElementById("lb-next").click();
  });

  // Filter pills
  document.querySelectorAll("#cand-filters .pill").forEach(p => {
    p.addEventListener("click", () => {
      candState.filter = p.dataset.filter;
      document.querySelectorAll("#cand-filters .pill").forEach(x =>
        x.classList.toggle("active", x === p));
      renderCandidates();
    });
  });

  async function loadCandidates() {
    try {
      const r = await fetch("/api/pipeline/candidates");
      const j = await r.json();
      candState.items = j.candidates || [];
      wmFetched.clear();
      renderCandidates();
    } catch (e) {
      console.error("loadCandidates", e);
    }
  }

  // Load when tab is first shown (or now if it's the active tab)
  let candLoaded = false;
  function maybeLoadCandidates() {
    if (candLoaded) return;
    if (currentTab() === "candidates") {
      candLoaded = true;
      loadCandidates();
    }
  }
  window.addEventListener("hashchange", maybeLoadCandidates);
  maybeLoadCandidates();
</script>
</body>
</html>
