<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes" />
<title>Tools Tree</title>
<style>
  :root { --bg:#0b0b0d; --fg:#e7e7ea; --muted:#8a8a90; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--fg);
               font:14px/1.4 -apple-system, system-ui, sans-serif; min-height:100vh; }
  .topbar { position:sticky; top:0; background:#111; padding:10px 14px;
            display:flex; align-items:center; gap:12px; border-bottom:1px solid #222; z-index:10; }
  .topbar h1 { margin:0; font-size:15px; font-weight:600; }
  .topbar .sub { color:var(--muted); font-size:12px; }
  .modes { position:relative; margin-left:auto; }
  .modes button { background:transparent; color:var(--fg); border:1px solid #333;
                  padding:6px 10px; border-radius:6px; cursor:pointer; font-size:18px; }
  .modemenu { position:absolute; top:110%; right:0; background:#1a1a1f;
              border:1px solid #333; border-radius:8px; min-width:160px; display:none; }
  .modemenu.open { display:block; }
  .modemenu a { display:block; padding:10px 14px; color:var(--fg);
                text-decoration:none; border-bottom:1px solid #2a2a30; }
  .modemenu a:last-child { border-bottom:0; }
  .modemenu a:hover { background:#2a2a30; }
  .modemenu a.active { background:#2d4a6d; }
  .wrap { padding:16px; overflow:auto; }
  .mermaid { background:#0f0f12; border-radius:8px; padding:16px; }
  .legend { display:flex; flex-wrap:wrap; gap:8px; padding:12px 16px;
            background:#111; border-bottom:1px solid #222; font-size:12px; }
  .legend .chip { display:inline-flex; align-items:center; gap:6px;
                  padding:4px 10px; border-radius:12px; border:1px solid; }
  .sw { width:10px; height:10px; border-radius:50%; display:inline-block; }
</style>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
</head>
<body>
<div class="topbar">
  <h1>🌳 Tools Tree</h1>
  <span class="sub" id="updated"></span>
  <div class="modes">
    <button onclick="toggleModes()">⋮</button>
    <div class="modemenu" id="modemenu">
      <a href="/gallery">🖼  Gallery</a>
      <a href="/candidates">📋 Candidates</a>
      <a href="/tree" class="active">🌳 Tools tree</a>
    </div>
  </div>
</div>
<div class="legend">
  <span class="chip" style="background:#1a6b1a; border-color:#4f4; color:#fff;"><span class="sw" style="background:#4f4;"></span>happy — loved, heavy use</span>
  <span class="chip" style="background:#2d5a1e; border-color:#4a9; color:#fff;"><span class="sw" style="background:#4a9;"></span>done — works, stable</span>
  <span class="chip" style="background:#8a6d1b; border-color:#fc3; color:#fff;"><span class="sw" style="background:#fc3;"></span>wip — in progress</span>
  <span class="chip" style="background:#5a3a1e; border-color:#a86; color:#ccc;"><span class="sw" style="background:#a86;"></span>tired — aging, low use</span>
  <span class="chip" style="background:#4a2a4a; border-color:#a6a; color:#ccc;"><span class="sw" style="background:#a6a;"></span>paused — parked</span>
  <span class="chip" style="background:#5a1e1e; border-color:#a44; color:#ccc;"><span class="sw" style="background:#a44;"></span>dropped — abandoned</span>
  <span class="chip" style="background:#333; border-color:#666; color:#999;"><span class="sw" style="background:#666;"></span>todo — not built</span>
  <span class="chip" style="background:#1a1a3a; border-color:#66f; color:#99f;"><span class="sw" style="background:#66f;"></span>idea — sketched</span>
  <span class="chip" style="background:#1a3a5a; border-color:#48c; color:#fff;"><span class="sw" style="background:#48c;"></span>foundation — shared infra</span>
</div>
<div class="wrap">
  <pre class="mermaid" id="mm">Loading…</pre>
</div>
<script>
function toggleModes() {
  document.getElementById('modemenu').classList.toggle('open');
}
document.addEventListener('click', (e) => {
  const m = document.getElementById('modemenu');
  if (!e.target.closest('.modes')) m.classList.remove('open');
});
mermaid.initialize({ startOnLoad: false, theme: 'dark',
                     securityLevel: 'loose', maxTextSize: 500000 });
fetch('/api/tree').then(r => r.json()).then(async (d) => {
  document.getElementById('updated').textContent = d.updated ? `updated ${d.updated}` : '';
  const el = document.getElementById('mm');
  el.textContent = d.mermaid || '(no diagram found)';
  if (d.mermaid) {
    const { svg } = await mermaid.render('mm-rendered', d.mermaid);
    el.innerHTML = svg;
  }
}).catch(err => {
  document.getElementById('mm').textContent = 'Error: ' + err;
});
</script>
</body>
</html>
