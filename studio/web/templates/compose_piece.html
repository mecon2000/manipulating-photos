<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Compose — {{ piece }}</title>
<link rel="stylesheet" href="{{ base }}/static/app.css">
<link rel="stylesheet" href="{{ base }}/static/compose.css">
</head>
<body>
<div class="topbar studio-topbar">
  <a class="back-link" href="{{ base }}/compose">‹</a>
  <div class="source-name" title="{{ piece }}">{{ piece }}</div>
  <div class="topbar-actions">
    <span id="sync-dot" class="sync-dot hidden" title="syncing…"></span>
    <a id="psd-link" class="chip hidden" href="#">PSD</a>
    <button id="fav-btn" class="btn btn-small btn-accent" title="Fav: full-res + layered PSD + favorites">Fav ★</button>
  </div>
</div>

<main class="studio-layout">
  <section class="canvas-col">
    <div id="canvas-wrap" class="canvas-wrap">
      <span id="busy-chip" class="chip busy-chip hidden"><span class="spin"></span><span id="busy-text">rendering…</span></span>
      <div id="stage-container" class="stage-container"></div>
    </div>
    <div class="mode-bar">
      <div class="mode-toggle" id="mode-toggle">
        <button class="mode-btn active" data-mode="pan">Pan</button>
        <button class="mode-btn" data-mode="markers">Pin a note</button>
      </div>
      <div id="move-bar" class="paint-bar hidden">
        <span class="paint-label">Move <b id="move-label"></b></span>
        <span class="paint-label" style="opacity:.7">drag to move · corners scale · top handle rotates</span>
        <button id="move-reset" class="btn btn-small" title="back to where it was generated">Reset</button>
        <button id="move-cancel" class="btn btn-small">Cancel</button>
        <button id="move-apply" class="btn btn-small btn-primary">Apply</button>
      </div>
      <div id="shape-bar" class="paint-bar hidden">
        <span class="paint-label">Tear <b id="shape-label"></b></span>
        <button id="shape-tab-strip" class="btn btn-small active" title="move / bend the torn strip">Strip</button>
        <button id="shape-tab-under" class="btn btn-small" title="move / rotate / scale the photo seen through the tear">Photo below</button>
        <label id="under-op-wrap" class="paint-tint hidden" title="see-through while you line up the eyes">see-through
          <input id="under-op" type="range" min="0.15" max="0.9" step="0.05" value="0.55"></label>
        <span id="strip-tools"><button id="shape-distort" class="btn btn-small active" title="corners move freely: skew / distort">Distort</button>
        <button id="shape-scale" class="btn btn-small" title="corners scale the whole strip evenly">Scale</button>
        <span class="paint-label" style="opacity:.7">● corners · ◆ bend · drag inside or ✥ to move · ↻ rotate</span></span>
        <button id="shape-reset" class="btn btn-small" title="back to the automatic placement on her eyes">Auto</button>
        <button id="shape-cancel" class="btn btn-small">Cancel</button>
        <button id="shape-apply" class="btn btn-small btn-accent">Apply</button>
      </div>
      <div id="paint-bar" class="paint-bar hidden">
        <span class="paint-label">Mask <b id="paint-label"></b></span>
        <button id="paint-tool-paint" class="btn btn-small" title="paint: the layer shows here">Paint</button>
        <button id="paint-tool-erase" class="btn btn-small" title="erase: the layer hides here">Erase</button>
        <label class="paint-tint" title="brush size">size <input id="paint-size" type="range" min="0.5" max="45" step="0.5" value="5"></label>
        <label class="paint-tint" title="feather: 0 = hard edge, 1 = very soft">soft
          <input id="paint-feather" type="range" min="0" max="1" step="0.05" value="0.5"></label>
        <label class="paint-tint" title="show the mask"><input id="paint-tint" type="checkbox" checked>
          <select id="paint-color"><option value="red">red</option><option value="green">green</option><option value="blue">blue</option></select></label>
        <button id="paint-all" class="btn btn-small" title="show the layer everywhere, then erase">All</button>
        <button id="paint-clear" class="btn btn-small" title="hide the layer everywhere, then paint">None</button>
        <button id="paint-remove" class="btn btn-small" title="drop the mask (layer shows everywhere)">No mask</button>
        <button id="paint-cancel" class="btn btn-small">Cancel</button>
        <button id="paint-apply" class="btn btn-small btn-accent">Apply</button>
      </div>
      <div class="sp-bar">
        <select id="sp-select" class="sp-select" title="Savepoints — pick one to compare"></select>
        <button id="vs-start-btn" class="btn btn-small" title="Compare with the start">vs start</button>
        <button id="save-btn" class="btn btn-small" title="Save point">Save point</button>
      </div>
      <div id="compare-bar" class="compare-bar hidden">
        <div class="cmp-top"><span id="cmp-label" class="cmp-label"></span>
          <button id="cmp-close" class="btn btn-small">✕</button></div>
        <button id="cmp-hold" class="btn cmp-hold" title="Hold to see the savepoint (or hold Space)">Hold to see savepoint</button>
        <div class="cmp-actions">
          <button id="cmp-mode" class="btn btn-small">Side by side</button>
          <button id="cmp-restore" class="btn btn-small btn-danger">Restore this</button>
        </div>
      </div>
    </div>
  </section>

  <section class="side-col compose-side">
    <div id="questions"></div>
    <div id="palette-row" class="palette-row hidden"></div>
    <div id="frame-row" class="palette-row">
      <span class="pal-label">Frame</span>
      <button id="crop-open" class="btn btn-small" title="re-crop from the whole original photo">✂ crop</button>
      <label class="paint-tint" title="deeper blacks on the model (highlights stay)">blacks
        <input id="blacks" type="range" min="0" max="1" step="0.05" value="0"></label>
    </div>

    <div class="collapsible" id="layers-sec">
      <div class="layers-head">
        <button class="collapsible-toggle" id="layers-toggle">Layers ▾</button>
        <button class="btn btn-small" id="clean-btn" title="Turn off every layer except paper and her; press again to bring the previous set back">Only model + paper</button>
      </div>
      <div class="collapsible-body" id="layers-body"></div>
    </div>

    <div class="collapsible docked" id="pins-sec">
      <button class="collapsible-toggle" id="pins-toggle">Notes (0) ▸</button>
      <div class="collapsible-body hidden" id="pins-body"></div>
    </div>

    <div class="collapsible docked" id="hist-sec">
      <button class="collapsible-toggle" id="hist-toggle">History ▸</button>
      <div class="collapsible-body hidden" id="hist-body"></div>
    </div>

    <div class="chat-col">
      <div class="chat-hint">Pin a note to point at a spot; chat for anything else.</div>
      <div id="chat-messages" class="chat-messages"></div>
      <form id="chat-form" class="chat-input-row">
        <input id="chat-input" type="text" placeholder="Talk to Studio about this piece…" autocomplete="off">
        <button type="submit" class="btn btn-accent">Send</button>
      </form>
    </div>
  </section>
</main>

<div id="pin-sheet" class="sheet hidden">
  <textarea id="pin-text" placeholder="What should change here?"></textarea>
  <div class="sheet-actions">
    <button id="pin-cancel" class="btn">Cancel</button>
    <button id="pin-send" class="btn btn-accent">Pin + send</button>
  </div>
</div>
<div id="lightbox" class="lightbox hidden">
  <div class="lb-stage"><img id="lb-img" alt=""></div>
  <div class="lb-bar">
    <button id="lb-prev" class="btn lb-nav hidden" aria-label="previous">‹</button>
    <div id="lb-cap" class="lb-cap"></div>
    <button id="lb-pick" class="btn btn-accent hidden">Pick</button>
    <button id="lb-next" class="btn lb-nav hidden" aria-label="next">›</button>
  </div>
</div>
<div id="toast" class="toast hidden"></div>

<script>window.COMPOSE = { base: "{{ base }}", piece: {{ piece|tojson }} };</script>
<script src="{{ base }}/static/vendor/konva.min.js"></script>
<script type="module" src="{{ base }}/static/compose_piece.js"></script>
<div id="crop-modal" class="crop-modal hidden">
  <div class="crop-top">
    <span class="crop-ratios" id="crop-ratios"></span>
    <span class="crop-btns">
      <button id="crop-cancel" class="btn btn-small">Cancel</button>
      <button id="crop-apply" class="btn btn-small btn-primary">Apply crop</button>
    </span>
  </div>
  <div class="crop-stage" id="crop-stage">
    <img id="crop-img" alt="">
    <div id="crop-rect" class="crop-rect">
      <i data-h="nw"></i><i data-h="ne"></i><i data-h="sw"></i><i data-h="se"></i>
      <i data-h="n"></i><i data-h="s"></i><i data-h="w"></i><i data-h="e"></i>
    </div>
  </div>
  <div class="crop-info" id="crop-info"></div>
</div>
</body>
</html>
