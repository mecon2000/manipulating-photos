<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Studio</title>
<link rel="stylesheet" href="{{ base }}/static/app.css">
</head>
<body>
<div class="topbar">
  <div class="title">Studio</div>
</div>

<main class="home">
  <form id="open-form" class="open-form">
    <input id="src-input" type="text" placeholder="Path to a photo…" autocomplete="off">
    <button type="submit" class="btn btn-accent">Open</button>
  </form>

  <h2 class="section-h">Sessions</h2>
  <div class="session-list">
    {% for s in sessions %}
    <a class="session-card" href="{{ base }}/s/{{ s.id }}">
      <div class="session-card-top">
        <span class="session-name">{{ s.source_name }}</span>
        <span class="session-id">#{{ s.id }}</span>
      </div>
      <div class="session-card-bottom">
        <span>{{ s.created_h }}</span>
        <span>{{ s.steps }} step{{ '' if s.steps == 1 else 's' }}</span>
      </div>
    </a>
    {% else %}
    <div class="empty-hint">No sessions yet. Open a photo above to start one.</div>
    {% endfor %}
  </div>
</main>

<div id="toast" class="toast hidden"></div>

<script>
  document.getElementById('open-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = document.getElementById('src-input').value.trim();
    if (!v) return;
    window.location.href = "{{ base }}/new?src=" + encodeURIComponent(v);
  });
</script>
</body>
</html>
